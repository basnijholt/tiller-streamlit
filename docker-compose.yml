services:
  tiller-streamlit:
    build: .
    container_name: tiller-streamlit
    restart: unless-stopped
    ports:
    - "8501:8501"
    volumes:
    - .:/app
    environment:
    - SERVICE_ACCOUNT_FILE=${SERVICE_ACCOUNT_FILE}
    - SCOPES=${SCOPES}
    - SPREADSHEET_ID=${SPREADSHEET_ID}
    labels:
    - traefik.enable=true
    - traefik.http.routers.tiller.rule=Host(`tiller.${DOMAIN}`)
    - traefik.http.routers.tiller.entrypoints=websecure
    - traefik.http.routers.tiller-local.rule=Host(`tiller.local`)
    - traefik.http.routers.tiller-local.entrypoints=web
    - traefik.http.services.tiller.loadbalancer.server.port=8501
    networks:
    - mynetwork

networks:
  mynetwork:
    external: true
